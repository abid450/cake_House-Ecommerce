# docker-compose.yml

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cake_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cake_house
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cake_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cake_redis
    restart: unless-stopped
    command: redis-server --requirepass abid4040
    ports:
      - "6334:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "abid4040", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cake_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=cake_house
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=django-db
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,provable-xerox-harmony.ngrok-free.dev,.ngrok-free.dev
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  celery_worker:
    build: .
    container_name: cake_celery_worker
    restart: unless-stopped
    command: celery -A cooking worker -l info --pool=solo --concurrency=1
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=cake_house
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=django-db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  celery_beat:
    build: .
    container_name: cake_celery_beat
    restart: unless-stopped
    command: celery -A cooking beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=cake_house
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=django-db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  flower:
    build: .
    container_name: cake_flower
    restart: unless-stopped
    command: celery -A cooking flower --port=5555 --address=0.0.0.0
    ports:
      - "5555:5555"
    environment:
      - DEBUG=True
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - rabbitmq
      - celery_worker
    networks:
      - app_network

  # ============================================
  # ✅ NGROK SERVICE (NEW)
  # ============================================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: cake_ngrok
    restart: unless-stopped
    command:
      - "http"
      - "web:8000"                              # ✅ Django container এ forward
      - "--authtoken=${NGROK_AUTH_TOKEN}"      # ✅ Token from .env
      - "--log=stdout"
      - "--log-format=json"
    ports:
      - "4040:4040"    # Ngrok Web Interface
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTH_TOKEN}
    depends_on:
      - web
    networks:
      - app_network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  app_network:
    driver: bridge