name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Redis so SESSION_ENGINE (cache-backed sessions) and cache
    # calls don't fail during tests — matches what settings.py expects.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: 'False'
      SECRET_KEY: 'ci-test-secret-key-not-for-production'
      DB_NAME: db.sqlite3
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      CELERY_TASK_ALWAYS_EAGER: 'True'   # run Celery tasks synchronously in-process during tests, no broker needed
      EMAIL_BACKEND: 'django.core.mail.backends.locmem.EmailBackend'  # capture emails in memory instead of trying real SMTP

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        run: |
          # Fails the build only on actual errors (syntax errors, undefined names);
          # style nitpicks are reported but don't block the pipeline yet.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2