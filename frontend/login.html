<!-- templates/auth/login.html -->

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন — সুবাস বেকারি</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================
           RESET & BASE
        ============================================ */
        :root {
            --bg-dark: #2A1620;
            --bg-dark-2: #3B1E2A;
            --bg-cream: #FAF1E2;
            --surface: #FFFDF9;
            --berry: #8E2E3B;
            --berry-deep: #6E1F2A;
            --berry-light: #C15C68;
            --gold: #C79A4B;
            --gold-deep: #A9812F;
            --gold-soft: #EAD3A0;
            --pistachio: #7C9473;
            --text-dark: #2A1620;
            --text-light: #F8EEDF;
            --line: rgba(42, 22, 32, 0.12);
            --line-light: rgba(248, 238, 223, 0.16);
            --shadow: 0 18px 40px -20px rgba(42, 22, 32, 0.35);
            --shadow-warm: 0 20px 36px -18px rgba(142, 46, 59, 0.28);
            --radius-card: 22px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
            background: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Noto Serif Bengali', serif;
            font-weight: 600;
            margin: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* ============================================
           AUTH CONTAINER
        ============================================ */
        .auth-container {
            max-width: 440px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius-card);
            padding: 40px 35px;
            box-shadow: var(--shadow-warm);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -60px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(199, 154, 75, 0.12), transparent 70%);
            pointer-events: none;
        }

        .auth-container .scallop-top {
            position: relative;
        }
        .auth-container .scallop-top::before {
            content: "";
            position: absolute;
            top: -11px;
            left: 0;
            right: 0;
            height: 22px;
            background: radial-gradient(circle at 11px 11px, transparent 10.5px, var(--surface) 11px);
            background-size: 22px 22px;
            background-repeat: repeat-x;
        }

        /* ============================================
           LOGO
        ============================================ */
        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: conic-gradient(from 210deg, var(--gold), var(--berry-light), var(--pistachio), var(--gold));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 3px var(--bg-dark), 0 0 0 4px var(--gold-soft);
            font-size: 24px;
            margin-bottom: 12px;
        }

        .auth-logo h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--bg-dark);
        }

        .auth-logo h1 span {
            color: var(--berry);
        }

        .auth-logo p {
            color: rgba(42, 22, 32, 0.55);
            font-size: 14px;
            margin-top: 4px;
        }

        /* ============================================
           ALERT
        ============================================ */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 18px;
            display: none;
        }

        .alert.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }

        .alert.success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .alert.info {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            display: block;
        }

        /* ============================================
           FORM
        ============================================ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(42, 22, 32, 0.4);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-dark);
            background: var(--bg-cream);
            transition: var(--transition);
            outline: none;
        }

        .form-group .input-wrapper input:focus {
            border-color: var(--berry);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(142, 46, 59, 0.08);
        }

        .form-group .input-wrapper input:focus+.input-icon {
            color: var(--berry);
        }

        .form-group .input-wrapper input::placeholder {
            color: rgba(42, 22, 32, 0.35);
        }

        .form-group .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(42, 22, 32, 0.35);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: var(--transition);
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: var(--text-dark);
        }

        .form-group .error-text {
            display: none;
            color: #dc2626;
            font-size: 13px;
            font-weight: 500;
            margin-top: 6px;
            padding-left: 4px;
        }

        .form-group .error-text.show {
            display: block;
        }

        .form-group input.is-invalid {
            border-color: #dc2626 !important;
            background: #fef2f2 !important;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08) !important;
        }

        .form-group input.is-valid {
            border-color: var(--pistachio) !important;
            background: #f0fdf4 !important;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.08) !important;
        }

        /* ============================================
           OPTIONS
        ============================================ */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 20px;
        }

        .form-options .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: rgba(42, 22, 32, 0.7);
            cursor: pointer;
        }

        .form-options .remember input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--berry);
            cursor: pointer;
        }

        .form-options .forgot-link {
            color: var(--berry);
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
        }

        .form-options .forgot-link:hover {
            color: var(--berry-deep);
            text-decoration: underline;
        }

        /* ============================================
           BUTTON
        ============================================ */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--berry) 0%, var(--berry-deep) 100%);
            color: var(--text-light);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(142, 46, 59, 0.35);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           FOOTER
        ============================================ */
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .auth-footer p {
            color: rgba(42, 22, 32, 0.55);
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--berry);
            font-weight: 600;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--berry-deep);
            text-decoration: underline;
        }

        /* ============================================
           DIVIDER WITH "OR"
        ============================================ */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: rgba(42, 22, 32, 0.3);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        /* ============================================
           SOCIAL BUTTONS
        ============================================ */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            color: var(--text-dark);
        }

        .btn-social:hover {
            border-color: var(--berry);
            background: var(--bg-cream);
            transform: translateY(-1px);
        }

        .btn-social i {
            font-size: 18px;
        }

        .btn-social.google i {
            color: #ea4335;
        }

        .btn-social.facebook i {
            color: #1877f2;
        }

        /* ============================================
           RESPONSIVE
        ============================================ */
        @media (max-width: 480px) {
            .auth-container {
                padding: 28px 20px;
            }
            .auth-logo h1 {
                font-size: 22px;
            }
            .form-options {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
            .btn-submit {
                font-size: 15px;
                padding: 12px;
            }
            .social-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container scallop-top">

        <!-- Logo -->
        <div class="auth-logo">
            <div class="brand-mark">🍰</div>
            <h1>সুবাস <span>বেকারি</span></h1>
            <p>আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        <!-- Alert -->
        <div id="alert" class="alert"></div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>

            <!-- Username / Email -->
            <div class="form-group">
                <label>ইউজারনেম বা ইমেইল <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="আপনার ইউজারনেম বা ইমেইল লিখুন" autocomplete="username">
                </div>
                <div class="error-text" id="usernameError"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>পাসওয়ার্ড <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="আপনার পাসওয়ার্ড লিখুন" autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="error-text" id="passwordError"></div>
            </div>

            <!-- Options -->
            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="remember" checked>
                    <span>আমাকে মনে রাখুন</span>
                </label>
                <a href="/forgot-password/" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> লগইন করুন</span>
            </button>

        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <p>অ্যাকাউন্ট নেই? <a href="/register/">একাউন্ট তৈরি করুন</a></p>
        </div>

    </div>

    <script>
        // ============================================
        // DOM Elements
        // ============================================
        const form = document.getElementById('loginForm');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const remember = document.getElementById('remember');
        const submitBtn = document.getElementById('submitBtn');
        const alertEl = document.getElementById('alert');

        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');

        // ============================================
        // Toggle Password Visibility
        // ============================================
        function togglePassword() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            const icon = document.querySelector('.toggle-password i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        }

        // ============================================
        // Show Alert
        // ============================================
        function showAlert(message, type = 'error') {
            alertEl.textContent = message;
            alertEl.className = `alert ${type}`;
            alertEl.style.display = 'block';
            setTimeout(() => { alertEl.style.display = 'none'; }, 5000);
        }

        // ============================================
        // Clear Errors
        // ============================================
        function clearErrors() {
            document.querySelectorAll('.form-group input').forEach(input => {
                input.classList.remove('is-invalid', 'is-valid');
            });
            document.querySelectorAll('.error-text').forEach(el => {
                el.textContent = '';
                el.classList.remove('show');
            });
            alertEl.style.display = 'none';
        }

        // ============================================
        // Set Field Error
        // ============================================
        function setFieldError(field, errorEl, message) {
            field.classList.add('is-invalid');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // ============================================
        // Validate Form
        // ============================================
        function validateForm() {
            let isValid = true;
            clearErrors();

            // Username
            if (!username.value.trim()) {
                setFieldError(username, usernameError, 'ইউজারনেম বা ইমেইল প্রয়োজন');
                isValid = false;
            } else if (username.value.trim().length < 3) {
                setFieldError(username, usernameError, 'ইউজারনেম কমপক্ষে ৩ অক্ষর হতে হবে');
                isValid = false;
            } else {
                username.classList.add('is-valid');
            }

            // Password
            if (!password.value.trim()) {
                setFieldError(password, passwordError, 'পাসওয়ার্ড প্রয়োজন');
                isValid = false;
            } else if (password.value.trim().length < 6) {
                setFieldError(password, passwordError, 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে');
                isValid = false;
            } else {
                password.classList.add('is-valid');
            }

            return isValid;
        }

        // ============================================
        // Get CSRF Token
        // ============================================
        function getCookie(name) {
            let value = null;
            if (document.cookie && document.cookie !== '') {
                document.cookie.split(';').forEach(c => {
                    const trimmed = c.trim();
                    if (trimmed.startsWith(name + '=')) {
                        value = decodeURIComponent(trimmed.substring(name.length + 1));
                    }
                });
            }
            return value;
        }

        // ============================================
        // Handle Login
        // ============================================
        async function handleLogin(e) {
            e.preventDefault();

            if (!validateForm()) return;

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify({
                        username: username.value.trim(),
                        password: password.value.trim(),
                    }),
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('access_token', data.data.access);
                    localStorage.setItem('refresh_token', data.data.refresh);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.data.user_id,
                        username: data.data.username,
                        email: data.data.email,
                        full_name: data.data.full_name,
                        is_email_verified: data.data.is_email_verified,
                    }));

                    showAlert('লগইন সফল! রিডাইরেক্ট হচ্ছে...', 'success');
                    setTimeout(() => { window.location.href = '/home/'; }, 1000);
                } else {
                    if (data.errors) {
                        if (data.errors.username) setFieldError(username, usernameError, data.errors.username);
                        if (data.errors.password) setFieldError(password, passwordError, data.errors.password);
                        if (data.errors.non_field_errors) showAlert(data.errors.non_field_errors.join(', '), 'error');
                    } else {
                        showAlert(data.message || 'লগইন ব্যর্থ হয়েছে। আবার চেষ্টা করুন।', 'error');
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('নেটওয়ার্ক সমস্যা। আপনার সংযোগ চেক করুন।', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        }

        // ============================================
        // Check if already logged in
        // ============================================
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (token) {
                window.location.href = '/';
            }
        }

        // ============================================
        // Event Listeners
        // ============================================
        form.addEventListener('submit', handleLogin);

        username.addEventListener('input', function() {
            if (this.value.trim()) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
                usernameError.classList.remove('show');
                usernameError.textContent = '';
            }
        });

        password.addEventListener('input', function() {
            if (this.value.trim()) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
                passwordError.classList.remove('show');
                passwordError.textContent = '';
            }
        });

        // ============================================
        // Init
        // ============================================
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>

</body>
</html>
